name: Rechentests

on:
  push:
  pull_request:

jobs:
  calc-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Gemeinsamer Aufruf: fuehrt beide Suiten aus (Rechen-/Regressionstests
      # UND SEC-Ableitungstests). Die zweite Suite laeuft auch dann, wenn die
      # erste fehlschlaegt; der Schritt endet rot, sobald eine Suite rot ist.
      - name: Beide Testsuiten ausführen
        run: node test/run-all.js

name: Rechentests

on:
  push:
  pull_request:

jobs:
  calc-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reine Rechen-/Regressionstests ausführen
        run: node test/run-calc-tests.js
